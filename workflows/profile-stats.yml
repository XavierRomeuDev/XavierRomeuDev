name: Update profile stats

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/generate-stats.mjs"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write # lets the automatic GITHUB_TOKEN commit the SVGs

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG cards
        run: node .github/scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided automatically by GitHub, nothing to configure
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile stats"
            git push
          fi
